<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Summarizer</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFF7ED;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #FB923C;
        }

        h3 {
            text-align: center;
            margin-top: -20px;
            margin-bottom: 40px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            background-color: #FB923C;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #F97316;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #summary-output {
            margin-top: 20px;
            background: #FEEDD5;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #summary-output h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        #summary-text {
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Text Summarizer</h1>

        <h3>Using Hugging Face Transformer</h3>

        <p>
            Write or paste your content below for quick summarization.
        </p>

        <form id="summarization-form">

            <textarea
                id="dialogue-input"
                placeholder="Enter your content here..."
                required
            ></textarea>

            <button type="submit">
                Submit
            </button>

        </form>


        <div id="summary-output">

            <h3>Content Summary</h3>

            <p id="summary-text">
                Your summary will appear here...
            </p>

        </div>

    </div>


    <script>

        document
            .getElementById("summarization-form")
            .addEventListener("submit", async (e) => {

                // Stop the page from refreshing
                e.preventDefault();


                // Get HTML elements
                const dialogueInput =
                    document.getElementById("dialogue-input");

                const summaryText =
                    document.getElementById("summary-text");

                const submitButton =
                    e.target.querySelector("button");


                // Get user input
                const dialogue =
                    dialogueInput.value.trim();


                // Check if input is empty
                if (!dialogue) {
                    summaryText.innerText =
                        "Please enter some text first.";
                    return;
                }


                // Show processing message
                summaryText.innerText =
                    "Processing...";


                // Disable button while processing
                submitButton.disabled = true;


                try {

                    // Send request to FastAPI
                    const response = await fetch("/summarize/", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            dialogue: dialogue
                        })

                    });


                    // Check server response
                    if (!response.ok) {

                        throw new Error(
                            `Server error: ${response.status}`
                        );

                    }


                    // Convert response to JSON
                    const data =
                        await response.json();


                    // Display summary
                    summaryText.innerText =
                        data.summary || "No summary returned.";


                } catch (error) {

                    // Display error
                    summaryText.innerText =
                        `Error: ${error.message}`;

                } finally {

                    // Enable button again
                    submitButton.disabled = false;

                }

            });

    </script>

</body>
</html>
